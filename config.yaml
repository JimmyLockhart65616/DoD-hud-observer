# DoD HUD Observer — KTP Backend Configuration
#
# Environment variable overrides (take precedence over this file):
#   HUD_AUTH_KEY        → ingest.auth_key
#   HUD_INGEST_PORT     → ingest.port
#   HUD_API_PORT        → api.port
#   HUD_SOCKET_PORT     → socket.port
#   HUD_MATCHES_DIR     → storage.matches_dir
#   HUD_FRONTEND_ORIGIN → frontend.origin

ingest:
  port: 8088
  auth_key: changeme

api:
  port: 3001

socket:
  port: 4000

storage:
  matches_dir: ./matches

frontend:
  origin: "http://localhost:3000"

# Legacy fields kept for API router compatibility (teams/players/matches CRUD)
auth:
  steam_api_key: ""

# HUD-to-HLTV broadcast sync. When enabled, ingested events are held in a
# per-server reorder buffer and released to Socket.IO at the wall-clock instant
# HLTV's broadcast clock catches up to each event's tick. Sample is taken via
# GoldSrc UDP RCON. Production HLTV `delay` setting and adminpassword live in
# /home/hltvserver/hlds/hltv.cfg on the data server (not in this repo).
#
# Env-var overrides:
#   HUD_HLTV_SYNC_ENABLED            → enabled (true/false)
#   HUD_HLTV_SYNC_HEARTBEAT_SECONDS  → heartbeat_seconds (0 disables)
#   HUD_HLTV_SYNC_FALLBACK_SECONDS   → fallback_delay_seconds
#   HUD_HLTV_SYNC_RCON_TIMEOUT_MS    → rcon_timeout_ms
hltv_sync:
  enabled: false
  heartbeat_seconds: 60
  fallback_delay_seconds: 60
  rcon_timeout_ms: 5000
  servers: {}
  # Production fleet (uncomment + set rcon_password when enabling — pull the
  # secret from KTPInfrastructure deploy machinery, do NOT inline it here):
  # "KTP - Atlanta 1": { hltv_addr: 127.0.0.1, hltv_port: 27020, rcon_password: <see hltv.cfg> }
  # "KTP - Atlanta 2": { hltv_addr: 127.0.0.1, hltv_port: 27021, rcon_password: <see hltv.cfg> }
  # ... (port = 27020 + index, see /home/hltvserver/hlds/configs/hltv-*.cfg)
