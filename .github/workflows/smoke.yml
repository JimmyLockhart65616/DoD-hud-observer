# KTP Tier 1 — Build-time smoke for KTPHudObserver
#
# Catches plugin-load regressions: missing native, wrong AMXX ABI,
# truncated build artifact, syntax error that compile.sh missed but the
# AMXX runtime rejects on load.
#
# Implementation lives in the reusable workflow at
# afraznein/KTPInfrastructure/.github/workflows/smoke-callable.yml. This
# file is just the trigger + assertion configuration.

name: Tier 1 Smoke

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  # Fork pull requests cannot run this job.
  #
  # The reusable workflow needs KTP_CHECKOUT_TOKEN to reach KTPInfrastructure,
  # and GitHub deliberately withholds repository secrets from workflows
  # triggered by `pull_request` from a fork. Running it anyway does not fail
  # honestly — it dies at checkout with an empty token, which reads as a red X
  # on the contributor's PR that they cannot fix and that says nothing about
  # their change.
  #
  # So skip it on fork PRs and say why (see `fork-notice` below). A maintainer
  # verifies the build by running `npm run plugin:smoke` locally, or by pushing
  # the contributor's branch to this repo, where the secret is available.
  #
  # This is a JOB-level `if`, not a workflow-level trigger filter, on purpose.
  # A job skipped by `if` still reports a check-run conclusion of "skipped",
  # which satisfies a required status check if main is ever protected. A
  # workflow filtered out by its trigger reports nothing at all and leaves a
  # required check Pending forever — that would block every fork PR instead of
  # unblocking it.
  #
  # NOTE: do NOT "fix" this by switching to pull_request_target. That runs
  # untrusted PR code in a context that DOES have the secrets, which is the
  # exact attack this restriction exists to prevent.
  smoke:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: afraznein/KTPInfrastructure/.github/workflows/smoke-callable.yml@main
    with:
      under_test_label: KTPHudObserver
      under_test_kind: amx_plugin
      amxx_source: KTPHudObserver.sma
      artifact_container_path: /opt/hlds/dod/addons/ktpamx/plugins/KTPHudObserver.amxx
      assert_plugin: KTPHudObserver
      caller_repo_path: KTPHudObserver
    secrets:
      ktp_checkout_token: ${{ secrets.KTP_CHECKOUT_TOKEN }}

  # Runs exactly when the job above skips, so a fork contributor gets an
  # explanation in the Actions tab instead of a silently absent check.
  #
  # The head repo name is passed through `env:` and printed with printf rather
  # than interpolated into the script body — a `${{ }}` expansion lands in the
  # shell source itself, and that is the standard Actions script-injection
  # vector.
  fork-notice:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain why Tier 1 Smoke did not run
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          {
            printf '### Tier 1 Smoke was skipped for this pull request\n\n'
            printf 'This PR comes from the fork `%s`, and GitHub does not grant\n' "$HEAD_REPO"
            printf 'repository secrets to workflows triggered from a fork. The smoke\n'
            printf 'job needs one to check out KTPInfrastructure, so it would fail at\n'
            printf 'checkout for reasons that have nothing to do with this change.\n\n'
            printf '**This is not a problem with your PR. There is nothing for you to fix.**\n\n'
            printf 'A maintainer will verify the build before merging. To check that the\n'
            printf 'plugin compiles on your own machine first:\n\n'
            printf '```bash\n'
            printf 'npm run plugin:smoke\n'
            printf '```\n\n'
            printf 'See CONTRIBUTING.md for what that needs (Docker, and a sibling\n'
            printf 'KTPInfrastructure checkout).\n'
          } >> "$GITHUB_STEP_SUMMARY"
