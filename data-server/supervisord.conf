[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# ============================================
# MySQL — HLStatsX database
# ============================================
[program:mysql]
command=/usr/sbin/mysqld --user=mysql
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mysql.log
stderr_logfile=/var/log/supervisor/mysql-err.log

# ============================================
# HLTV Proxy 1 — connects to game server 1
# ============================================
# Config mounted at /opt/hltv/instance-1/hltv.cfg
# Port MUST be set via -port (engine arg), NOT the cfg `port` directive: hltv.cfg
# is auto-exec'd before the Proxy module loads, so `port` is "not registered" and
# silently ignored — both proxies then default to 27020 and the second dies with
# WSAEADDRINUSE. -port is applied at engine init, before modules load.
[program:hltv-1]
command=/opt/hltv/instance-1/hltv -port 27020
directory=/opt/hltv/instance-1
environment=LD_LIBRARY_PATH="/opt/hltv"
autorestart=true
priority=20
startsecs=5
stdout_logfile=/var/log/supervisor/hltv-1.log
stderr_logfile=/var/log/supervisor/hltv-1-err.log

# ============================================
# HLTV Proxy 2 — connects to game server 2
# ============================================
# Config mounted at /opt/hltv/instance-2/hltv.cfg
# Port via -port (see hltv-1 note) — without it this proxy collides with hltv-1 on 27020.
[program:hltv-2]
command=/opt/hltv/instance-2/hltv -port 27021
directory=/opt/hltv/instance-2
environment=LD_LIBRARY_PATH="/opt/hltv"
autorestart=true
priority=20
startsecs=5
stdout_logfile=/var/log/supervisor/hltv-2.log
stderr_logfile=/var/log/supervisor/hltv-2-err.log

# ============================================
# HLStatsX log receiver (stub)
# ============================================
# Listens on UDP 27500 for game server log lines and writes them to
# /var/log/supervisor/hlstatsx.log.
#
# THIS NOW RECEIVES TRAFFIC. Until 2026-08-24 it never had: config/local/
# dodserver.cfg set `log on` / `sv_logecho` / `sv_logfile` but carried no
# `logaddress_add`, so nothing forwarded the log stream off the game servers and
# not one line ever arrived. Production has `logaddress_add 74.91.112.242 27500`;
# local now has `logaddress_add data 27500` in the same position. Tail the log
# above to see the real producer output from stats_logging.amxx.
#
# STILL A STUB, and replacing it is blocked on an upstream dependency rather
# than on effort: KTPHLStatsX publishes only the KTP delta. `hlstats.pl` requires
# seven files it does not ship (ConfigReaderSimple.pm, TRcon.pm, BASTARDrcon.pm,
# HLstats_Server.pm, HLstats_Player.pm, HLstats_Game.pm, HLstats_GameConstants.plib)
# and `sql/ktp_schema.sql` is likewise a delta — applying it to an empty database
# fails at line 42 on a missing `hlstats_Events_Frags`, which lives in the base
# `install.sql` that is also not shipped. Both come from upstream HLStatsX:CE
# (GPL v2). Vendoring a third-party base into the KTP stack is the repo owner's
# call, so it is deliberately NOT done here.
[program:hlstatsx-stub]
command=socat -u UDP4-LISTEN:27500,fork,reuseaddr STDOUT
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/hlstatsx.log
stderr_logfile=/var/log/supervisor/hlstatsx-err.log

# ============================================
# Node.js backend — HUD Observer
# ============================================
[program:backend]
command=/usr/local/bin/node /app/node_modules/.bin/ts-node --script-mode /app/backend/src/app.ts
directory=/app
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend-err.log

# ============================================
# React frontend — static build served on :3000
# ============================================
[program:frontend]
command=serve -s /app/web/build -l 3000
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend-err.log

# ============================================
# nginx — single-origin reverse proxy on :80
# ============================================
# Fronts the overlay (:3000), REST API (:3001), and Socket.IO (:4000) as one
# origin, mirroring the production nginx vhost. Config at /etc/nginx/conf.d/hud.conf
# (see data-server/nginx-hud.conf). Starts after the app processes it proxies.
[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-err.log
