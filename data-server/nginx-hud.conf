# DoD HUD Observer — single-origin reverse proxy (LOCAL docker mirror).
#
# Mirrors the production nginx vhost (deploy/nginx/hud.ktpdod.com.conf) so the
# local docker stack exercises the same single-origin routing prod uses — the
# React overlay, the REST API, and Socket.IO all served from ONE origin so the
# HTTPS/OBS-CEF mixed-content + Socket.IO CORS constraints are validated locally.
#
# Difference vs prod: HTTP only (no public DNS / ACME cert) and listens on :80
# inside the container, published to the host as :8080 by the compose file.
#
# Installed to /etc/nginx/conf.d/hud.conf (included at http{} scope by the stock
# Ubuntu nginx.conf, so the `map` directive below is valid here). The stock
# sites-enabled/default is removed in the Dockerfile so this is the only :80
# server.
#
# Ports proxied to (all loopback inside the container):
#   127.0.0.1:3000  serve  — React static build (OBS overlay)
#   127.0.0.1:3001  node   — REST API (/api/*, /health, /metrics)
#   127.0.0.1:4000  node   — Socket.IO (/socket.io/, needs WS upgrade)
# Ingest (:8088) is intentionally NOT proxied — it's a direct IP-restricted POST.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name localhost;

    # Socket.IO — WebSocket upgrade + polling handshake
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API + health/metrics
    location ~ ^/(api/|health$|metrics$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else = the React overlay (existing `serve` on :3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
