# DoD HUD Observer — single-origin reverse proxy (LOCAL docker mirror, HTTPS).
#
# Byte-identical to production: same origin string (https://hud.ktpdod.com), same
# :443 TLS + :80→:443 redirect, same routing. The only prod difference is the
# cert issuer — prod uses certbot/Let's Encrypt; locally you mount a mkcert cert
# (trusted padlock) OR fall back to the self-signed cert start.sh generates.
#
# Reach it locally by pointing hud.ktpdod.com at 127.0.0.1 in your hosts file;
# the frontend bundle is built against https://hud.ktpdod.com so it must be
# served from that origin (single-origin: overlay + REST + Socket.IO all here,
# so the HTTPS page never hits a mixed-content/CORS wall and Socket.IO upgrades
# to wss through nginx exactly as in prod).
#
# Installed to /etc/nginx/conf.d/hud.conf. The stock sites-enabled/default is
# removed in the Dockerfile so this is the only server.
#
# Cert files (mounted at ./data-server/certs, or self-signed by start.sh):
#   /etc/nginx/certs/hud.ktpdod.com.pem       cert
#   /etc/nginx/certs/hud.ktpdod.com-key.pem   key
#
# Proxies (all loopback inside the container):
#   127.0.0.1:3000  serve  — React static build (OBS overlay)
#   127.0.0.1:3001  node   — REST API (/api/*, /health, /metrics)
#   127.0.0.1:4000  node   — Socket.IO (/socket.io/, wss upgrade)
# Ingest (:8088) is intentionally NOT proxied — direct IP-restricted POST.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# :80 → :443 redirect (mirrors prod's certbot-generated redirect server)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hud.ktpdod.com localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name hud.ktpdod.com localhost;

    ssl_certificate     /etc/nginx/certs/hud.ktpdod.com.pem;
    ssl_certificate_key /etc/nginx/certs/hud.ktpdod.com-key.pem;

    # Socket.IO — WebSocket upgrade (wss) + polling handshake
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # REST API + health/metrics
    location ~ ^/(api/|health$|metrics$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else = the React overlay (existing `serve` on :3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
