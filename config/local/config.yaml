# DoD HUD Observer — local-dev backend configuration.
#
# Loaded by default when HUD_CONFIG_PATH is unset. Mirrors the
# KTPInfrastructure config/local + config/online split: this file is committed
# with safe defaults, the production counterpart at config/online/config.yaml
# is gitignored and lives on the data server at /opt/hud-observer/config.yaml.
#
# Environment variable overrides (take precedence over this file):
#   HUD_CONFIG_PATH                  → which config.yaml to load
#   HUD_AUTH_KEY                     → ingest.auth_key
#   HUD_INGEST_PORT                  → ingest.port
#   HUD_API_PORT                     → api.port
#   HUD_SOCKET_PORT                  → socket.port
#   HUD_MATCHES_DIR                  → storage.matches_dir
#   HUD_FRONTEND_ORIGIN              → frontend.origin
#   HUD_HLTV_SYNC_ENABLED            → hltv_sync.enabled (true/false)
#   HUD_HLTV_SYNC_HEARTBEAT_SECONDS  → hltv_sync.heartbeat_seconds (0 disables)
#   HUD_HLTV_SYNC_FALLBACK_SECONDS   → hltv_sync.fallback_delay_seconds
#   HUD_HLTV_SYNC_BOARD_LAG_SECONDS  → hltv_sync.board_release_lag_seconds
#   HUD_HLTV_SYNC_COAST_GRACE_SECONDS → hltv_sync.coast_grace_seconds
#   HUD_HLTV_SYNC_RCON_TIMEOUT_MS    → hltv_sync.rcon_timeout_ms
#   HUD_HLTV_API_URL                 → hltv_sync.api_url (empty disables /state)
#   HUD_HLTV_API_AUTH_KEY            → hltv_sync.api_auth_key
#   HUD_HLTV_API_TIMEOUT_MS          → hltv_sync.api_timeout_ms

ingest:
  port: 8088
  auth_key: changeme

api:
  port: 3001

socket:
  port: 4000

storage:
  matches_dir: ./matches

frontend:
  origin: "http://localhost:3000"

# Legacy field kept for API router compatibility (teams/players/matches CRUD).
auth:
  steam_api_key: ""

# HUD-to-HLTV broadcast sync. When enabled, ingested events are held in a
# per-server reorder buffer and released to Socket.IO at the wall-clock instant
# HLTV's broadcast clock catches up to each event's tick.
#
# Off by default in this file: `npm run backend` (laptop dev) has no HLTV proxy
# to talk to. The local docker stack overrides via HUD_CONFIG_PATH to read
# KTPInfrastructure/config/local/config.yaml (which enables hltv_sync against
# the in-container HLTV proxies). Production overrides via HUD_CONFIG_PATH to
# /opt/hud-observer/config/online/config.yaml on the data server.
hltv_sync:
  enabled: false
  heartbeat_seconds: 60
  fallback_delay_seconds: 60
  # Extra late-bias (seconds) for the halftime / match-end stats board at a
  # changelevel. The board's release is a dynamic broadcast-clock projection off
  # the pre-reset HLTV clock; this nudges ONLY the board a touch later (never
  # earlier). 0 = feed-aligned: the board lands exactly as the delayed broadcast
  # reaches that moment (still never early). Raise it if you want the board to
  # trail further as broadcaster filler through the changelevel/warmup wait.
  board_release_lag_seconds: 0
  # Keep coasting the last good clock across transient RCON failures for this long
  # (seconds, measured from the last good sample) before falling to the fixed
  # fallback delay. Spans ~2 missed 60s heartbeats so a brief proxy hiccup doesn't
  # collapse the delay or step the clock on recovery.
  coast_grace_seconds: 120
  rcon_timeout_ms: 5000
  # hltv-api 2.2 integration. When api_url is non-empty, each successful RCON
  # sample also fetches GET /hltv/<port>/state for diagnostic correlation with
  # the broadcast offset bug. Pure observation — does not affect clock math.
  # Leave api_url empty (default) on dev machines without hltv-api running.
  api_url: ""
  api_auth_key: ""
  api_timeout_ms: 3000
  servers: {}

# Read-only connection to the KTPHLStatsX `hlstatsx` MySQL database (the league's
# stats system of record, written only by the HLStatsX Perl daemon).
#
# OFF here on purpose: that database binds 127.0.0.1 on the data server, so it
# does not exist on a dev laptop and every /api/stats/* route answers 503.
# Production runs this backend on the same host, so it enables this with a
# SELECT-only user via config/online/config.yaml. Grant SELECT and nothing more —
# nothing in this repo may write to that database.
#
#   HUD_STATSDB_ENABLED    HUD_STATSDB_HOST     HUD_STATSDB_PORT
#   HUD_STATSDB_USER       HUD_STATSDB_PASSWORD HUD_STATSDB_DATABASE
#   HUD_STATSDB_POOL       HUD_STATSDB_TIMEOUT_MS
stats_db:
  enabled: false
  host: 127.0.0.1
  port: 3306
  user: ""
  password: ""
  database: hlstatsx
  connection_limit: 4
  timeout_ms: 5000
