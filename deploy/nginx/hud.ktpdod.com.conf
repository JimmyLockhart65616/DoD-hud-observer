# DoD HUD Observer — PRODUCTION nginx vhost for hud.ktpdod.com
#
# Gives the overlay a friendly, portless, single-origin HTTPS URL:
#   https://hud.ktpdod.com/screen?server=KTP%20-%20Denver%205   ← OBS browser source
#
# Single origin is REQUIRED, not cosmetic: over HTTPS the frontend's Socket.IO
# (:4000) + REST (:3001) calls must be same-origin or the browser and OBS's
# embedded Chromium block them as mixed content → blank overlay. Socket.IO's CORS
# is pinned to the backend's frontend.origin (credentials:true), which must
# include https://hud.ktpdod.com exactly.
#
# Mirrors the existing sibling vhost watch.ktpdod.com (the same app, LAN-side via
# frp :28080): literal `Connection "upgrade"` (NO `map` — the box defines none,
# and adding one risks a duplicate-directive break of every vhost), ssl_protocols
# TLSv1.2/1.3, `listen 443 ssl http2` (nginx 1.24 — the standalone `http2 on;`
# directive is 1.25.1+ only). Our backends are :3000/:3001/:4000; watch.ktpdod.com
# (:28080) and dodworldseries.com (:8099) are untouched.
#
# ── Applying on the box (data server, cadaver@74.91.112.242) ────────────────
#   sudo mkdir -p /var/www/ktp-hud
#   # 1. Place THIS file's :80 block only (comment out the :443 server), enable, reload:
#   sudo ln -s /etc/nginx/sites-available/hud.ktpdod.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # 2. Obtain the cert via webroot (matches watch.ktpdod.com's acme flow):
#   sudo certbot certonly --webroot -w /var/www/ktp-hud -d hud.ktpdod.com
#   # 3. Un-comment the :443 server block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ingest (:9000) is NOT proxied — game servers POST directly, UFW-restricted.

server {
    listen 80;
    listen [::]:80;
    server_name hud.ktpdod.com;
    location /.well-known/acme-challenge/ { root /var/www/ktp-hud; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hud.ktpdod.com;

    ssl_certificate     /etc/letsencrypt/live/hud.ktpdod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hud.ktpdod.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Socket.IO — WebSocket upgrade + long-poll handshake (literal, like watch.ktpdod.com)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # REST API + health/metrics
    location ~ ^/(api/|health$|metrics$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else = the React overlay (existing `serve` unit on :3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
