# DoD HUD Observer — PRODUCTION nginx vhost for hud.ktpdod.com
#
# The data server (cadaver@74.91.112.242 / neindataatl) already runs nginx on
# :80 fronting other KTP services; the bare hud.ktpdod.com URL currently 404s
# because no vhost matches it. This vhost gives the overlay a friendly, portless,
# single-origin HTTPS URL:
#
#   https://hud.ktpdod.com/screen?server=KTP%20-%20Denver%205   ← OBS browser source
#
# Single origin is REQUIRED, not cosmetic: served over HTTPS, the frontend's
# Socket.IO (:4000) + REST (:3001) calls must be same-origin or the browser and
# OBS's embedded Chromium (CEF) block them as mixed content → blank overlay.
# Socket.IO server CORS is also pinned to frontend.origin (credentials:true), so
# the serving origin must equal https://hud.ktpdod.com exactly.
#
# ── Applying on the box (see deploy/README.md → "nginx vhost") ──────────────
#   1. Inspect first:  sudo nginx -T   (match the box's sites-*/conf.d layout)
#   2. Place this file where the box keeps vhosts (e.g.
#      /etc/nginx/sites-available/hud.ktpdod.com.conf + symlink into
#      sites-enabled/, or /etc/nginx/conf.d/hud.ktpdod.com.conf).
#   3. TLS: if a wildcard *.ktpdod.com cert already exists, point
#      ssl_certificate[_key] at it and drop the certbot managed lines. Otherwise:
#         sudo certbot --nginx -d hud.ktpdod.com
#      which fills in the ssl_certificate lines, adds the :80→:443 redirect
#      server block, and installs the auto-renew timer.
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: if the running config already defines `map $http_upgrade $connection_upgrade`
# in http{} scope (grep the `nginx -T` dump), delete the map block below to avoid
# a duplicate-directive error.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hud.ktpdod.com;

    # TLS — managed by certbot (certbot --nginx -d hud.ktpdod.com) OR point these
    # at an existing wildcard *.ktpdod.com cert:
    #   ssl_certificate     /etc/letsencrypt/live/hud.ktpdod.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/hud.ktpdod.com/privkey.pem;

    # Socket.IO — WebSocket upgrade + long-poll handshake
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep idle websockets alive across quiet stretches
    }

    # REST API + health/metrics
    location ~ ^/(api/|health$|metrics$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else = the React overlay (existing `serve` unit on :3000, untouched)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Ingest (:9000 prod) is intentionally NOT proxied here — game servers POST
# directly to the IP, UFW-restricted. Keeping it off the domain means this vhost
# never touches plugin→backend connectivity.
