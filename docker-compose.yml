# DoD HUD Observer — Standalone Data Server
#
# Runs the HUD Observer backend + frontend in Docker (for CI or isolated testing).
# For a full KTP stack (game servers + data server + HLTV proxies), use:
#   KTPInfrastructure/docker-compose.local.yml
#
# Usage:
#   docker compose up -d        # start data server
#   docker compose down         # stop
#   docker compose logs -f      # tail logs
#
# Ports:
#   8080 — nginx single-origin reverse proxy (overlay + /api + /socket.io) ← use this
#   3000 — React frontend (direct; normally reached through :8080)
#   3001 — REST API (direct; normally reached through :8080)
#   4000 — Socket.IO (direct; normally reached through :8080)
#   8088 — HTTP ingest (AMXX plugin POSTs here; NOT proxied)

services:
  data:
    build:
      context: .
      dockerfile: data-server/Dockerfile
    environment:
      # The frontend bundle is built against the single-origin proxy
      # (http://localhost:8080), so Socket.IO's CORS origin must match. Set via
      # env rather than editing the dev-shared config/local/config.yaml (whose
      # frontend.origin stays :3000 for the host `npm run backend` workflow).
      HUD_FRONTEND_ORIGIN: http://localhost:8080
    ports:
      - "8080:80"
      - "3000:3000"
      - "3001:3001"
      - "4000:4000"
      - "8088:8088"
      - "27020:27020/udp"
      - "27021:27021/udp"
      - "27500:27500/udp"
      - "3306:3306"
    volumes:
      - "./config/local/config.yaml:/app/config/local/config.yaml:ro"
      - "mysql-data:/var/lib/mysql"


volumes:
  mysql-data:
