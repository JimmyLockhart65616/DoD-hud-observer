# DoD HUD Observer — Standalone Data Server
#
# Runs the HUD Observer backend + frontend in Docker (for CI or isolated testing).
# For a full KTP stack (game servers + data server + HLTV proxies), use:
#   KTPInfrastructure/docker-compose.local.yml
#
# Usage:
#   docker compose up -d        # start data server
#   docker compose down         # stop
#   docker compose logs -f      # tail logs
#
# Ports — reach the overlay at https://localhost (single origin, HTTPS, no hosts
# file needed; the same nginx setup runs prod at https://hud.ktpdod.com):
#   443  — nginx single-origin reverse proxy, TLS (overlay + /api + /socket.io) ← use this
#   80   — nginx :80→:443 redirect
#   3000 — React frontend (direct; normally reached through nginx)
#   3001 — REST API (direct; normally reached through nginx)
#   4000 — Socket.IO (direct; normally reached through nginx)
#   8088 — HTTP ingest (AMXX plugin POSTs here; NOT proxied)
#
# TLS cert: start.sh self-signs a fallback (SAN localhost) so `up` just works —
# the browser warns once until you accept it. For a zero-warning padlock (or OBS),
# drop a mkcert cert in ./data-server/certs (see deploy/README.md → Friendly URL).

services:
  data:
    build:
      context: .
      dockerfile: data-server/Dockerfile
    environment:
      # The overlay is served origin-relative at https://localhost, so Socket.IO's
      # credentials CORS origin must match. Set via env rather than editing the
      # dev-shared config/local/config.yaml (whose frontend.origin stays :3000 for
      # the host `npm run backend` workflow).
      HUD_FRONTEND_ORIGIN: https://localhost
      # Point the read-only stats layer at this container's own MySQL. The
      # committed config/local/config.yaml keeps stats_db.enabled=false for the
      # host `npm run backend` workflow (no MySQL on a laptop), so it is enabled
      # here by env instead of editing that shared file. Credentials match the
      # ones data-server/start.sh creates on first boot.
      #
      # The database is EMPTY until you seed it — see scripts/seed-statsdb.sh.
      HUD_STATSDB_ENABLED: "true"
      HUD_STATSDB_HOST: 127.0.0.1
      HUD_STATSDB_PORT: "3306"
      HUD_STATSDB_USER: hlstatsx
      HUD_STATSDB_PASSWORD: ktptest
      HUD_STATSDB_DATABASE: hlstatsx
    ports:
      - "443:443"
      - "80:80"
      - "3000:3000"
      - "3001:3001"
      - "4000:4000"
      - "8088:8088"
      - "27020:27020/udp"
      - "27021:27021/udp"
      - "27500:27500/udp"
      - "3306:3306"
    volumes:
      - "./config/local/config.yaml:/app/config/local/config.yaml:ro"
      # mkcert cert (locally trusted), read-only. start.sh copies it into the
      # writable cert dir nginx reads, or self-signs a fallback if this is empty
      # so nginx still starts. Gitignored — machine-specific.
      - "./data-server/certs:/etc/nginx/certs-src:ro"
      - "mysql-data:/var/lib/mysql"


volumes:
  mysql-data:
